<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basic Image Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Basic Image Gallery</h1>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="nature">Nature</button>
      <button class="filter-btn" data-filter="animals">Animals</button>
      <button class="filter-btn" data-filter="city">City</button>
    </div>
  </header>

  <main>
    <section class="gallery" aria-label="Image Gallery">
      <div class="gallery-item" data-category="nature">
        <img src="https://picsum.photos/id/1018/300/200" alt="Nature Image 1" />
      </div>
      <div class="gallery-item" data-category="animals">
        <img src="https://picsum.photos/id/1025/300/200" alt="Animal Image 1" />
      </div>
      <div class="gallery-item" data-category="city">
        <img src="https://picsum.photos/id/1031/300/200" alt="City Image 1" />
      </div>
      <div class="gallery-item" data-category="nature">
        <img src="https://picsum.photos/id/1015/300/200" alt="Nature Image 2" />
      </div>
      <div class="gallery-item" data-category="animals">
        <img src="https://picsum.photos/id/1024/300/200" alt="Animal Image 2" />
      </div>
      <div class="gallery-item" data-category="city">
        <img src="https://picsum.photos/id/1043/300/200" alt="City Image 2" />
      </div>
    </section>
  </main>

  <!-- Lightbox Modal -->
  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-label="Image preview">
    <button class="close-btn" aria-label="Close">&times;</button>
    <button class="prev-btn" aria-label="Previous image">&#10094;</button>
    <img class="lightbox-image" src="" alt="" />
    <button class="next-btn" aria-label="Next image">&#10095;</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
